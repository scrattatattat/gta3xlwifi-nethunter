name: Build NetHunter Kernel gta3xlwifi

on:
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Install System Dependencies
      run: |
        sudo apt-get update --allow-releaseinfo-change || true
        sudo apt-get update -o Acquire::ForceIPv4=true --fix-missing || true
        
        # Removed bterm to prevent the 'Unable to locate package' halt
        sudo apt-get install -y --fix-missing bc build-essential libncurses5-dev libssl-dev xz-utils git bison flex libelf-dev clang lld llvm zip

    - name: Download Google Android Toolchains
      run: |
        mkdir -p $GITHUB_WORKSPACE/toolchain
        cd $GITHUB_WORKSPACE/toolchain
        git clone --depth=1 https://googlesource.com -b android-10.0.0_r47 gcc64
        git clone --depth=1 https://googlesource.com -b android-10.0.0_r47 gcc32

    - name: Clone Kernel Source
      run: |
        git clone --depth=1 https://github.com -b lineage-18.1 $GITHUB_WORKSPACE/kernel

    - name: Clone AnyKernel3 Flash Template
      run: |
        git clone --depth=1 https://github.com $GITHUB_WORKSPACE/AnyKernel3

    - name: Patch NetHunter Kernel Defconfig
      run: |
        cd $GITHUB_WORKSPACE/kernel
        DEFCONFIG="arch/arm64/configs/gta3xlwifi_defconfig"
        
        sed -i 's/CONFIG_CFG80211=m/CONFIG_CFG80211=y/g' $DEFCONFIG || true
        
        echo "CONFIG_CFG80211=y" >> $DEFCONFIG
        echo "CONFIG_MAC80211=y" >> $DEFCONFIG
        echo "CONFIG_CFG80211_WEXT=y" >> $DEFCONFIG
        echo "CONFIG_USB_G_ANDROID=y" >> $DEFCONFIG
        echo "CONFIG_USB_F_HID=y" >> $DEFCONFIG
        echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
        echo "CONFIG_ATH_CARDS=y" >> $DEFCONFIG
        echo "CONFIG_ATH9K_HTC=m" >> $DEFCONFIG
        echo "CONFIG_CARL9170=m" >> $DEFCONFIG
        echo "CONFIG_USB_NET_RNDIS_WLAN=m" >> $DEFCONFIG

    - name: Compile Kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel
        export PATH="$GITHUB_WORKSPACE/toolchain/gcc64/bin:$GITHUB_WORKSPACE/toolchain/gcc32/bin:$PATH"
        export ARCH=arm64
        export SUBARCH=arm64
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-
        
        make gta3xlwifi_defconfig
        make -j$(nproc) KCFLAGS="-w"

    - name: Package with AnyKernel3
      run: |
        if [ -f $GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image.gz-dtb ]; then
          cp $GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image.gz-dtb $GITHUB_WORKSPACE/AnyKernel3/
        elif [ -f $GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image ]; then
          cp $GITHUB_WORKSPACE/kernel/arch/arm64/boot/Image $GITHUB_WORKSPACE/AnyKernel3/
        else
          echo "Kernel image compilation failed entirely." && exit 1
        fi
        
        cd $GITHUB_WORKSPACE/AnyKernel3
        zip -r9 ../NetHunter-Kernel-gta3xlwifi.zip * -x .git* README.md

    - name: Upload Finished Kernel Zip
      uses: actions/upload-artifact@v4
      with:
        name: NetHunter-Kernel-gta3xlwifi
        path: NetHunter-Kernel-gta3xlwifi.zip
